<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <h2>模型配置</h2>
  <div id="modelList"></div>
  <button id="addModel">+ 添加模型</button>

  <h2>用量统计（近 7 天，token 为估算值）</h2>
  <div id="usageSummary" class="usage-summary">加载中…</div>

  <h2>知识库</h2>
  <p class="card-note">选择知识库来源并填写凭证；可切换多个来源，聊天框「＋」菜单会使用当前激活的来源。</p>
  <div class="kb-providers" id="kbProviderTabs"></div>
  <div id="kbProviderForms"></div>

  <div class="actions">
    <button id="save">保存</button>
    <span id="msg"></span>
  </div>
  <script type="module" src="options.js"></script>
</body>
</html>
