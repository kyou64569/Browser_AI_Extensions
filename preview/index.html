<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI 助手 · 侧边栏</title>
  <link rel="stylesheet" href="preview.css" />
</head>
<body>
  <!-- 顶部应用栏：左侧 会话列表 / 功能 图标 + 标题，右侧设置 -->
  <div class="app-bar">
    <div class="app-bar-left">
      <button class="icon-btn" id="navConversations" title="会话列表">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </button>
      <button class="icon-btn" id="navFeatures" title="功能">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      </button>
      <div class="app-title">
        <span class="dot"></span>
        <span id="barTitle">AI 助手</span>
      </div>
    </div>
    <button class="icon-btn" id="navSettings" title="设置">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>

  <!-- 视图容器 -->
  <div class="views">

    <!-- 视图 1：聊天（主页面） -->
    <section class="view view-chat is-active" id="view-chat">
      <div class="chat-scroll" id="chatScroll">
        <div class="welcome" id="welcome">
          <div class="welcome-logo">AI</div>
          <h2>有什么可以帮你的？</h2>
          <p>提问、翻译、解释、总结 —— 都由统一模型链路驱动。</p>
        </div>
      </div>

      <div class="status-bar" id="chatStatus"></div>

      <form class="composer" id="composer">
        <!-- 功能模式高亮标签：激活功能期间显示，发送消息或手动关闭后消失 -->
        <div class="func-tag" id="funcTag" hidden></div>
        <div class="chat-box">
          <div class="attachments" id="attachments"></div>
          <textarea id="chatInput" rows="2" placeholder="给 AI 助手发消息…  (Enter 发送，Shift+Enter 换行)"></textarea>
          <div class="composer-bar">
            <div class="composer-left">
              <div class="plus-wrap">
                <button type="button" class="icon-btn plus-btn" id="plusBtn" title="功能" aria-haspopup="true" aria-expanded="false">
                  <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                </button>
                <!-- 功能列表菜单 -->
                <div class="func-menu" id="funcMenu" role="menu" hidden>
                  <button type="button" class="func-item" role="menuitem" data-act="file">
                    <span class="fi-ico">📎</span><span class="fi-label">添加文件</span>
                  </button>
                  <button type="button" class="func-item" role="menuitem" data-act="summarize">
                    <span class="fi-ico">📄</span><span class="fi-label">总结网页</span>
                  </button>
                  <button type="button" class="func-item" role="menuitem" data-act="translate">
                    <span class="fi-ico">🌐</span><span class="fi-label">翻译</span>
                  </button>
                  <button type="button" class="func-item" role="menuitem" data-act="explain">
                    <span class="fi-ico">💡</span><span class="fi-label">解释</span>
                  </button>
                  <button type="button" class="func-item" role="menuitem" data-act="automate">
                    <span class="fi-ico">🤖</span><span class="fi-label">网页操作</span>
                  </button>
                </div>
              </div>
              <select id="modelSelect" class="model-select" title="选择模型"></select>
              <select id="thinkingSelect" class="thinking-select" title="思考强度" hidden></select>
              <input type="file" id="fileInput" accept="image/*,text/*,.txt,.md,.json,.csv,.pdf,.js,.ts,.py,.html,.css" multiple hidden />
            </div>
            <button type="submit" id="sendBtn" class="send-btn" title="发送" disabled>
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </button>
          </div>
        </div>
      </form>
    </section>

    <!-- 视图 4：会话列表 -->
    <section class="view view-conversations" id="view-conversations">
      <div class="page">
        <div class="conv-header">
          <h2 class="page-title">会话列表</h2>
          <button class="primary" id="newConvBtn">+ 新建会话</button>
        </div>
        <div class="conv-list" id="convList"></div>
      </div>
    </section>

    <!-- 视图 2：功能 -->
    <section class="view view-features" id="view-features">
      <div class="page">
        <h2 class="page-title">功能</h2>

        <div class="card">
          <h3>本地知识库（可选）</h3>
          <label class="field">服务地址 <input id="kbBase" placeholder="http://localhost:8000" /></label>
        </div>
      </div>
    </section>

    <!-- 视图 3：设置 -->
    <section class="view view-settings" id="view-settings">
      <div class="page">
        <h2 class="page-title">
          <span>设置</span>
          <span class="theme-switch" id="themeSwitch" role="group" aria-label="主题模式">
            <button type="button" class="theme-icon" data-theme="light" title="浅色模式" aria-label="浅色模式">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
            </button>
            <button type="button" class="theme-icon" data-theme="dark" title="深色模式" aria-label="深色模式">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </button>
            <button type="button" class="theme-icon" data-theme="system" title="跟随系统" aria-label="跟随系统">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
            </button>
          </span>
        </h2>

        <div class="card">
          <div class="card-head">
            <h3>模型配置</h3>
            <button class="mini" id="addModel">+ 添加模型</button>
          </div>
          <div id="modelList" class="model-list"></div>
        </div>

        <div class="card">
          <div class="card-head">
            <h3>备用模型配置（自动降级）</h3>
            <button class="mini" id="addBackupModel">+ 添加备用模型</button>
          </div>
          <p class="card-note">当前聊天模型调用失败时，按列表优先级依次尝试以下备用模型；温度 / TopP 等参数沿用失败的原模型。</p>
          <div id="backupModelList" class="model-list"></div>
        </div>

        <div class="card tip">
          <p>提示：在扩展侧边栏中可直接调用各厂商接口（含官方端点）；Ollama 等本地服务也支持浏览器直连。</p>
        </div>
      </div>
    </section>

  </div>

  <script type="module" src="preview.js"></script>
</body>
</html>
